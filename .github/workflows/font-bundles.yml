name: Generate Font Bundles

on:
  push:
    branches:
      - main
    paths:
      - 'fonts.md'
  workflow_dispatch:
    inputs:
      bundle_version:
        description: 'Font bundle version/tag (e.g. fonts-2026.01)'
        required: false
        default: ''
      base_url:
        description: 'Optional base URL prefix. Leave empty to use this repository release URL.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-font-bundles:
    name: Generate & Upload Font Bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve Bundle Version & Base URL
        run: |
          INPUT_VERSION="${{ github.event.inputs.bundle_version }}"
          if [ -n "$INPUT_VERSION" ]; then
            BUNDLE_VERSION="$INPUT_VERSION"
          else
            BUNDLE_VERSION="fonts-$(date +'%Y.%m')"
          fi

          BASE_URL="${{ github.event.inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://github.com/${{ github.repository }}/releases/download"
          fi

          echo "BUNDLE_VERSION=$BUNDLE_VERSION" >> "$GITHUB_ENV"
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "Resolved BUNDLE_VERSION: $BUNDLE_VERSION"
          echo "Resolved BASE_URL: $BASE_URL"

      - name: Generate Font Bundles
        run: |
          ./gradlew :getgooglefont-compressit:compressFonts \
            -PbundleVersion="$BUNDLE_VERSION" \
            -PbaseUrl="$BASE_URL" \
            --stacktrace

      - name: Upload Font Bundles to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUNDLE_VERSION }}
          files: build/font-bundles/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request for Updated Font Manifests
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(fonts): update bundles.json and fonts.json for ${{ env.BUNDLE_VERSION }}"
          title: "chore(fonts): update font bundles for ${{ env.BUNDLE_VERSION }}"
          body: |
            Automated PR generated after generating font bundles for **${{ env.BUNDLE_VERSION }}**.

            This PR contains the regenerated `bundles.json` and `fonts.json`.
          add-paths: |
            app/src/main/res/raw/bundles.json
            app/src/main/res/raw/fonts.json
          branch: "release/font-bundles-${{ env.BUNDLE_VERSION }}"
          base: "main"
          delete-branch: true
